name: ci
on:
  pull_request:
  push:
    branches: [dev, master]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
      # Not --strict: the seed legitimately carries flex-require, which the
      # strict publish schema rejects; the real oracle is create-project below.
      - run: composer validate --no-check-publish
      - name: create-project end to end
        run: |
          cd "$RUNNER_TEMP"
          composer create-project minspec/skeleton app --repository="{\"type\":\"path\",\"url\":\"$GITHUB_WORKSPACE\"}" --stability=dev --no-interaction
          cd app
          php bin/console about
